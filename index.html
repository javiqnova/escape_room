<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Is Brain: The Stroke Museum Heist</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (to parse JSX in the browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Merriweather', serif; }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        .animate-bounce-up { animation: bounceUp 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes bounceUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICON COMPONENTS (Inline SVGs) ---
        const Icon = ({ path, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {path}
            </svg>
        );

        const Icons = {
            Lock: (props) => <Icon {...props} path={<><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>} />,
            Unlock: (props) => <Icon {...props} path={<><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></>} />,
            AlertCircle: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></>} />,
            CheckCircle: (props) => <Icon {...props} path={<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>} />,
            XCircle: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></>} />,
            BookOpen: (props) => <Icon {...props} path={<><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>} />,
            Clock: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>} />,
            Brain: (props) => <Icon {...props} path={<><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></>} />,
            Activity: (props) => <Icon {...props} path={<><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></>} />,
            User: (props) => <Icon {...props} path={<><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>} />,
            DoorOpen: (props) => <Icon {...props} path={<><path d="M13 4h3a2 2 0 0 1 2 2v14"/><path d="M2 20h3"/><path d="M13 20h9"/><path d="M10 12v.01"/><path d="M13 4.562v16.157a1 1 0 0 1-1.242.97L5 20V5.562a2 2 0 0 1 1.515-1.94l4-1A2 2 0 0 1 13 4.561Z"/></>} />,
            Sparkles: (props) => <Icon {...props} path={<><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M9 3v4"/><path d="M3 9h4"/><path d="M3 5h4"/></>} />,
            MessageSquare: (props) => <Icon {...props} path={<><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></>} />,
            Loader: (props) => <Icon {...props} path={<><path d="M21 12a9 9 0 1 1-6.219-8.56"/></>} />,
            AlertTriangle: (props) => <Icon {...props} path={<><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></>} />,
        };

        // --- CONFIGURATION ---
        const GAME_CONFIG = {
            finalCode: "47291",
            title: "Time Is Brain: The Stroke Museum Heist",
            introText: "You are locked in the Museum of Neurology. To escape, you must demonstrate your expertise in acute stroke management. Find 5 clues hidden within the artifacts to unlock the main exit. Remember: Time is Brain.",
            // IMPORTANT: This filename must match your uploaded file exactly
            bgImage: "Time Is Brain_ The Stroke Museum Heist.jpg", 
            fallbackImage: "https://images.unsplash.com/photo-1518152006812-edab29b069ac?q=80&w=2070&auto=format&fit=crop",
            timeLimitSeconds: 300 // 5 Minutes
        };

        const PUZZLES = [
            {
                id: 'hourglass',
                title: 'The Sands of Time',
                position: { bottom: '5%', right: '10%', width: '15%', height: '30%' },
                question: "A 65-year-old patient arrives with right-sided hemiparesis. The Last Known Well (LKW) time was exactly 3.5 hours ago. There are no contraindications. What is the standard maximum time window for IV thrombolysis (alteplase) in eligible patients?",
                options: [
                { id: 'a', text: "3.0 hours", correct: false },
                { id: 'b', text: "4.5 hours", correct: true, digit: '4' },
                { id: 'c', text: "6.0 hours", correct: false },
                { id: 'd', text: "24 hours", correct: false }
                ],
                feedback: {
                correct: "Correct. The window for IV thrombolysis is up to 4.5 hours for select patients (ECASS III trial data).",
                wrong: "Incorrect. While the original window was 3 hours, guidelines extended this for eligible patients."
                }
            },
            {
                id: 'mri',
                title: 'The Diagnostic Machine',
                position: { top: '40%', left: '42%', width: '16%', height: '20%' },
                question: "A patient presents with acute stroke symptoms. Upon arrival at the ED, what is the single most critical INITIAL diagnostic test to perform before considering fibrinolytic therapy?",
                options: [
                { id: 'a', text: "MRI Brain with Diffusion", correct: false },
                { id: 'b', text: "Carotid Doppler Ultrasound", correct: false },
                { id: 'c', text: "Non-contrast CT Head", correct: true, digit: '7' },
                { id: 'd', text: "Lumbar Puncture", correct: false }
                ],
                feedback: {
                correct: "Correct. A Non-contrast CT is mandatory to rule out intracranial hemorrhage before giving tPA.",
                wrong: "Incorrect. While MRI is sensitive, a Non-contrast CT is the standard first-line rapid image to rule out bleed."
                }
            },
            {
                id: 'clot',
                title: 'The Clot Display',
                position: { top: '15%', right: '2%', width: '20%', height: '40%' },
                question: "A patient has a Large Vessel Occlusion (LVO) in the internal carotid artery. According to DAWN and DEFUSE-3 trials, mechanical thrombectomy is indicated up to how many hours after LKW in select patients?",
                options: [
                { id: 'a', text: "6 hours", correct: false },
                { id: 'b', text: "12 hours", correct: false },
                { id: 'c', text: "24 hours", correct: true, digit: '2' },
                { id: 'd', text: "48 hours", correct: false }
                ],
                feedback: {
                correct: "Correct. Mechanical thrombectomy can be performed up to 24 hours in patients with tissue-clinical mismatch.",
                wrong: "Incorrect. The window has been extended significantly beyond 6 or 12 hours for specific criteria."
                }
            },
            {
                id: 'statue',
                title: 'The Patient Statue',
                position: { top: '28%', right: '25%', width: '10%', height: '35%' },
                question: "You examine a patient who has significant weakness in the LEFT LEG, but minimal weakness in the left arm and face. They also appear apathetic (abulia). Which vascular territory is most likely affected?",
                options: [
                { id: 'a', text: "Left Middle Cerebral Artery (MCA)", correct: false },
                { id: 'b', text: "Right Middle Cerebral Artery (MCA)", correct: false },
                { id: 'c', text: "Right Anterior Cerebral Artery (ACA)", correct: true, digit: '9' },
                { id: 'd', text: "Basilar Artery", correct: false }
                ],
                feedback: {
                correct: "Correct. ACA strokes classically present with contralateral leg weakness > arm weakness.",
                wrong: "Incorrect. MCA strokes typically affect the face and arm more than the leg."
                }
            },
            {
                id: 'brain',
                title: 'The Giant Brain',
                position: { top: '10%', left: '0%', width: '30%', height: '60%' },
                question: "In acute ischemic stroke, there is a core of irreversible infarction surrounded by a zone of hypoperfused but potentially salvageable tissue. What is this salvageable zone called?",
                options: [
                { id: 'a', text: "The Penumbra", correct: true, digit: '1' },
                { id: 'b', text: "The Watershed", correct: false },
                { id: 'c', text: "The Lacune", correct: false },
                { id: 'd', text: "The Gliosis", correct: false }
                ],
                feedback: {
                correct: "Correct. The Penumbra is the target of acute reperfusion therapies.",
                wrong: "Incorrect. Try again. It refers to the 'shadow' area around the core."
                }
            }
        ];

        // --- GEMINI API HANDLER ---
        const callGemini = async (prompt, systemInstruction = "") => {
            const apiKey = ""; // Set your API key if you want the hints to work on GitHub Pages
            if (!apiKey) {
                console.warn("API Key missing");
                return "The Senior Resident is unavailable. (Note to instructor: Add API Key in index.html to enable hints).";
            }

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] }
            };

            try {
                const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`API Error: ${response.status}`);

                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "The AI is currently silent. Try again.";
            } catch (error) {
                console.error("Gemini API Error:", error);
                return "Connection error. The Senior Resident is currently unavailable.";
            }
        };

        // --- COMPONENTS ---

        const Modal = ({ isOpen, onClose, title, children, type = 'normal' }) => {
            if (!isOpen) return null;

            let headerColor = "bg-slate-800";
            if (type === 'success') headerColor = "bg-green-700";
            if (type === 'error') headerColor = "bg-red-700";
            if (type === 'intro') headerColor = "bg-blue-900";
            if (type === 'lost') headerColor = "bg-red-900";

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
                    <div className={`w-full max-w-lg bg-slate-900 border border-slate-700 rounded-xl shadow-2xl overflow-hidden transform transition-all scale-100 max-h-[90vh] overflow-y-auto`}>
                        <div className={`${headerColor} px-6 py-4 flex justify-between items-center border-b border-slate-700 sticky top-0 z-10`}>
                        <h2 className="text-xl font-bold text-white font-serif tracking-wide">{title}</h2>
                        {type !== 'intro' && type !== 'lost' && (
                            <button onClick={onClose} className="text-slate-300 hover:text-white transition-colors">
                                <Icons.XCircle className="w-6 h-6" />
                            </button>
                        )}
                        </div>
                        <div className="p-6 text-slate-200">
                        {children}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [gameState, setGameState] = useState('intro'); // intro, playing, locked, won, lost
            const [solvedPuzzles, setSolvedPuzzles] = useState([]);
            const [currentPuzzle, setCurrentPuzzle] = useState(null);
            const [keypadOpen, setKeypadOpen] = useState(false);
            const [inputCode, setInputCode] = useState("");
            const [feedback, setFeedback] = useState(null);
            
            // Timer State
            const [timeLeft, setTimeLeft] = useState(GAME_CONFIG.timeLimitSeconds);
            
            // Image State
            const [imgSrc, setImgSrc] = useState(GAME_CONFIG.bgImage);
            const [imageError, setImageError] = useState(false);

            // AI State
            const [aiLoading, setAiLoading] = useState(false);
            const [aiHint, setAiHint] = useState("");
            const [aiDebrief, setAiDebrief] = useState("");

            // Timer Effect
            useEffect(() => {
                if (gameState === 'playing' && timeLeft > 0) {
                const timerId = setTimeout(() => {
                    setTimeLeft(timeLeft - 1);
                }, 1000);
                return () => clearTimeout(timerId);
                } else if (gameState === 'playing' && timeLeft === 0) {
                setGameState('lost');
                }
            }, [timeLeft, gameState]);

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            };

            const handlePuzzleClick = (puzzle) => {
                setAiHint(""); 
                if (solvedPuzzles.includes(puzzle.id)) {
                setFeedback({ 
                    type: 'success', 
                    message: `You have already solved this. The clue digit is: ${puzzle.options.find(o => o.correct).digit}` 
                });
                } else {
                setCurrentPuzzle(puzzle);
                }
            };

            const handleAnswer = (option) => {
                if (option.correct) {
                setSolvedPuzzles([...solvedPuzzles, currentPuzzle.id]);
                
                // Calculate which position this digit is for (1-based index)
                const position = GAME_CONFIG.finalCode.indexOf(option.digit) + 1;
                
                setFeedback({ 
                    type: 'success', 
                    message: `${currentPuzzle.feedback.correct} You found a clue: Digit ${option.digit} (Position: ${position})` 
                });
                setCurrentPuzzle(null);
                setAiHint("");
                } else {
                setFeedback({ 
                    type: 'error', 
                    message: currentPuzzle.feedback.wrong 
                });
                }
            };

            const handleKeypadSubmit = () => {
                if (inputCode === GAME_CONFIG.finalCode) {
                setGameState('won');
                setKeypadOpen(false);
                } else {
                setFeedback({ type: 'error', message: "Access Denied. The code is incorrect." });
                setInputCode("");
                }
            };

            const handleKeypadInput = (num) => {
                if (inputCode.length < 5) {
                setInputCode(prev => prev + num);
                }
            };

            const fetchAIHint = async () => {
                if (!currentPuzzle) return;
                setAiLoading(true);
                setAiHint("");
                
                const correctAnswer = currentPuzzle.options.find(o => o.correct).text;
                
                const systemPrompt = "You are a senior neurology resident mentoring a medical student. Be helpful, encouraging, but Socratic. Do NOT give the direct answer. Provide a clinical hint or explain the underlying pathophysiology that guides them to the correct option.";
                const userPrompt = `The student is looking at this question: "${currentPuzzle.question}". The options are: ${currentPuzzle.options.map(o => o.text).join(', ')}. The correct answer is "${correctAnswer}". Give a short hint (max 2 sentences) to help them figure it out.`;

                const hint = await callGemini(userPrompt, systemPrompt);
                setAiHint(hint);
                setAiLoading(false);
            };

            const fetchAIDebrief = async () => {
                setAiLoading(true);
                const systemPrompt = "You are a medical educator specializing in stroke neurology. Summarize the key learning points from a case simulation.";
                const userPrompt = "The student has successfully completed a simulation covering: 4.5hr IV tPA window, Non-contrast CT as initial diagnostic, 24hr Thrombectomy window (DAWN/DEFUSE-3), Anterior Cerebral Artery (ACA) syndrome symptoms, and the concept of Penumbra. Write a brief, bulleted 'Clinical Debrief' (max 4 bullets) summarizing these key takeaways for them to remember.";

                const debrief = await callGemini(userPrompt, systemPrompt);
                setAiDebrief(debrief);
                setAiLoading(false);
            };

            return (
                <div className="relative w-full h-screen bg-slate-950 overflow-hidden font-sans select-none text-slate-100">
                
                {/* Background Image Container */}
                <div className="absolute inset-0 z-0 flex items-center justify-center bg-black">
                    <img 
                        src={imgSrc} 
                        alt="Stroke Museum" 
                        className="w-full h-full object-cover opacity-80"
                        onError={() => {
                        if (!imageError) {
                            setImgSrc(GAME_CONFIG.fallbackImage);
                            setImageError(true);
                        }
                        }}
                    />
                    {imageError && (
                    <div className="absolute top-4 left-1/2 -translate-x-1/2 bg-yellow-900/80 text-yellow-200 px-4 py-1 rounded-full text-xs border border-yellow-700 z-50">
                        Using fallback image. Ensure filename matches exactly in GAME_CONFIG.
                    </div>
                    )}
                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/40 pointer-events-none"></div>
                </div>

                {/* HEADER HUD */}
                <div className="absolute top-0 left-0 right-0 z-10 p-4 flex justify-between items-start bg-gradient-to-b from-black/90 to-transparent">
                    <div>
                    <h1 className="text-2xl font-serif text-amber-500 tracking-wider shadow-black drop-shadow-md">
                        {GAME_CONFIG.title}
                    </h1>
                    <p className="text-slate-400 text-sm">Target: Healthcare Graduate Students</p>
                    </div>
                    
                    <div className="flex gap-4">
                    {/* Timer */}
                    <div className={`backdrop-blur border px-4 py-2 rounded-lg flex items-center gap-2 font-mono text-lg font-bold shadow-lg ${timeLeft < 60 ? 'bg-red-900/80 border-red-500 animate-pulse text-white' : 'bg-slate-900/80 border-slate-700 text-amber-400'}`}>
                        <Icons.Clock className="w-5 h-5" />
                        <span>{formatTime(timeLeft)}</span>
                    </div>

                    <div className="bg-slate-900/80 backdrop-blur border border-slate-700 px-4 py-2 rounded-lg flex items-center gap-2">
                        <Icons.BookOpen className="w-4 h-4 text-blue-400" />
                        <span className="text-sm font-bold">Clues: {solvedPuzzles.length} / 5</span>
                    </div>
                    <button 
                        onClick={() => setKeypadOpen(true)}
                        className="bg-amber-600 hover:bg-amber-500 text-white px-6 py-2 rounded-lg shadow-lg shadow-amber-900/50 flex items-center gap-2 transition-all transform hover:scale-105 font-bold"
                    >
                        <Icons.Lock className="w-4 h-4" />
                        UNLOCK
                    </button>
                    </div>
                </div>

                {/* GAME AREA */}
                {gameState === 'playing' && (
                    <div className="absolute inset-0 z-0">
                    {/* Exit Door */}
                    <div 
                        className="absolute cursor-pointer transition-colors duration-300 rounded-t-full"
                        style={{ top: '35%', left: '35%', width: '8%', height: '15%' }}
                        onClick={() => setKeypadOpen(true)}
                        title="Exit Door"
                    ></div>

                    {/* Puzzles */}
                    {PUZZLES.map((puzzle) => (
                        <div
                        key={puzzle.id}
                        className="absolute cursor-pointer"
                        style={puzzle.position}
                        onClick={() => handlePuzzleClick(puzzle)}
                        title={puzzle.title} 
                        ></div>
                    ))}
                    </div>
                )}

                {/* INTRO MODAL */}
                <Modal isOpen={gameState === 'intro'} title="Mission Briefing" type="intro" onClose={() => {}}>
                    <div className="space-y-4">
                    <p className="text-lg leading-relaxed text-blue-100">{GAME_CONFIG.introText}</p>
                    <div className="bg-slate-800 p-4 rounded-lg border border-slate-600 text-sm">
                        <h3 className="font-bold text-amber-400 mb-2">Instructions:</h3>
                        <ul className="list-disc list-inside space-y-1 text-slate-300">
                        <li>You have <strong>10 minutes</strong> before the penumbra is lost.</li>
                        <li>Explore the museum by clicking on artifacts (zones are hidden).</li>
                        <li>Answer 5 multiple-choice questions correctly to get the code.</li>
                        <li>Use the <strong>Consult Senior Resident</strong> button if stuck.</li>
                        </ul>
                    </div>
                    <button onClick={() => setGameState('playing')} className="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold shadow-lg transition-transform transform hover:scale-[1.02]">
                        START TIMER & ENTER
                    </button>
                    </div>
                </Modal>

                {/* LOST MODAL */}
                <Modal isOpen={gameState === 'lost'} title="TIME EXPIRED" type="lost" onClose={() => {}}>
                    <div className="space-y-6 text-center">
                    <Icons.AlertTriangle className="w-16 h-16 text-red-500 mx-auto" />
                    <div className="space-y-2">
                        <h2 className="text-2xl font-bold text-white">The Penumbra is Lost.</h2>
                        <p className="text-slate-300">You failed to treat the patient within the critical time window. In stroke care, every minute counts.</p>
                    </div>
                    <button onClick={() => window.location.reload()} className="w-full py-3 bg-red-700 hover:bg-red-600 text-white rounded-lg font-bold shadow-lg transition-transform transform hover:scale-[1.02]">TRY AGAIN</button>
                    </div>
                </Modal>

                {/* PUZZLE MODAL */}
                <Modal isOpen={!!currentPuzzle} title={currentPuzzle?.title || ""} onClose={() => setCurrentPuzzle(null)}>
                    <div className="space-y-6">
                    <p className="text-lg font-medium text-white">{currentPuzzle?.question}</p>
                    <div className="space-y-3">
                        {currentPuzzle?.options.map((option) => (
                        <button
                            key={option.id}
                            onClick={() => handleAnswer(option)}
                            className="w-full text-left p-4 rounded-lg bg-slate-800 border border-slate-600 hover:bg-blue-900/50 hover:border-blue-400 transition-all group"
                        >
                            <span className="font-bold text-blue-400 mr-2 group-hover:text-white">{option.id.toUpperCase()}.</span>
                            {option.text}
                        </button>
                        ))}
                    </div>

                    <div className="mt-6 border-t border-slate-700 pt-4">
                        {!aiHint && !aiLoading && (
                        <button onClick={fetchAIHint} className="w-full py-2 bg-purple-700 hover:bg-purple-600 text-white rounded-lg flex items-center justify-center gap-2 transition-all shadow-lg">
                            <Icons.Sparkles className="w-4 h-4" /> Consult Senior Resident for a Hint (AI)
                        </button>
                        )}
                        
                        {aiLoading && (
                        <div className="flex items-center gap-2 text-purple-300 text-sm animate-pulse">
                            <Icons.Loader className="w-4 h-4 animate-spin" /> The resident is thinking...
                        </div>
                        )}

                        {aiHint && (
                        <div className="bg-purple-900/30 border border-purple-500/30 rounded-lg p-3 mt-2 animate-fade-in">
                            <div className="flex gap-2 items-start">
                            <Icons.MessageSquare className="w-5 h-5 text-purple-400 shrink-0 mt-1" />
                            <div>
                                <p className="text-xs text-purple-300 font-bold mb-1">Senior Resident says:</p>
                                <p className="text-sm text-purple-100 italic">"{aiHint}"</p>
                            </div>
                            </div>
                        </div>
                        )}
                    </div>
                    </div>
                </Modal>

                {/* KEYPAD MODAL */}
                <Modal isOpen={keypadOpen} title="Security Lock" onClose={() => setKeypadOpen(false)}>
                    <div className="flex flex-col items-center space-y-6">
                    <div className="bg-black border-4 border-slate-700 rounded px-8 py-4 w-full text-center">
                        <span className="font-mono text-4xl tracking-[0.5em] text-red-500 h-12 block">{inputCode.padEnd(5, '_')}</span>
                    </div>
                    <div className="grid grid-cols-3 gap-3 w-full max-w-[250px]">
                        {[1, 2, 3, 4, 5, 6, 7, 8, 9].map((num) => (
                        <button key={num} onClick={() => handleKeypadInput(num.toString())} className="bg-slate-700 hover:bg-slate-600 text-white text-xl font-bold py-4 rounded shadow-inner active:scale-95 transition-all">{num}</button>
                        ))}
                        <button onClick={() => setInputCode("")} className="bg-red-900/80 hover:bg-red-800 text-white font-bold py-4 rounded">CLR</button>
                        <button onClick={() => handleKeypadInput("0")} className="bg-slate-700 hover:bg-slate-600 text-white text-xl font-bold py-4 rounded">0</button>
                        <button onClick={handleKeypadSubmit} className="bg-green-700 hover:bg-green-600 text-white font-bold py-4 rounded">ENT</button>
                    </div>
                    </div>
                </Modal>

                {/* FEEDBACK POPUP */}
                {feedback && (
                    <div className="fixed bottom-8 left-1/2 -translate-x-1/2 z-[60] animate-bounce-up">
                    <div className={`px-6 py-4 rounded-lg shadow-2xl border flex items-center gap-3 ${
                        feedback.type === 'success' ? 'bg-green-900/90 border-green-500 text-green-100' : 'bg-red-900/90 border-red-500 text-red-100'
                    }`}>
                        {feedback.type === 'success' ? <Icons.CheckCircle /> : <Icons.AlertCircle />}
                        <span className="font-medium">{feedback.message}</span>
                        <button onClick={() => setFeedback(null)} className="ml-4 hover:opacity-75"><Icons.XCircle className="w-5 h-5"/></button>
                    </div>
                    </div>
                )}

                {/* VICTORY MODAL */}
                {gameState === 'won' && (
                    <div className="fixed inset-0 z-[70] flex flex-col items-center justify-center bg-black/95 animate-fade-in text-center p-8 overflow-y-auto">
                    <Icons.DoorOpen className="w-24 h-24 text-green-500 mb-6 shrink-0" />
                    <h1 className="text-5xl font-serif text-amber-500 mb-4">ESCAPED!</h1>
                    <p className="text-xl text-slate-300 max-w-2xl mb-8">Congratulations. You have demonstrated excellent knowledge of acute stroke protocols.</p>
                    
                    <div className="w-full max-w-2xl mb-8">
                        {!aiDebrief && !aiLoading && (
                        <button onClick={fetchAIDebrief} className="px-6 py-3 bg-purple-700 hover:bg-purple-600 text-white rounded-lg font-bold shadow-lg flex items-center gap-2 mx-auto transition-all">
                            <Icons.Sparkles className="w-5 h-5" /> Generate Clinical Debrief (AI)
                        </button>
                        )}
                        {aiLoading && (
                        <div className="flex justify-center items-center gap-2 text-purple-300 mt-4">
                            <Icons.Loader className="w-6 h-6 animate-spin" /> <span className="animate-pulse">Compiling performance review...</span>
                        </div>
                        )}
                        {aiDebrief && (
                        <div className="bg-slate-800 border border-slate-600 rounded-lg p-6 text-left animate-fade-in shadow-2xl">
                            <h3 className="text-lg font-bold text-amber-400 mb-4 flex items-center gap-2"><Icons.Activity className="w-5 h-5" /> Clinical Debrief:</h3>
                            <div className="prose prose-invert prose-sm max-w-none text-slate-300 whitespace-pre-line">{aiDebrief}</div>
                        </div>
                        )}
                    </div>
                    <button onClick={() => window.location.reload()} className="px-8 py-3 bg-white text-black font-bold rounded-full hover:bg-slate-200 transition-colors">PLAY AGAIN</button>
                    </div>
                )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
